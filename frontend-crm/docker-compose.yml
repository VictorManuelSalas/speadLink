services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  node_modules:

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: speedlink-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  frontend-production:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: speedlink-frontend-production
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  frontend_node_modules:
